name: CI

on:
  push:
    branches: [ v2 ]
  pull_request:
    branches: [ v2 ]

jobs:
  backend-test:
    name: Backend Test Suite & ONNX Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0 libzbar-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verify Python Compilation & Import Hygiene
        run: |
          python -m py_compile main.py auth.py config.py logger.py model_utils.py schemas.py
          # Verify that importing model_utils does NOT load tensorflow into sys.modules
          python -c "import model_utils, sys; assert 'tensorflow' not in sys.modules, 'TensorFlow should not be loaded on ONNX path'"

      - name: Run Pytest Suite
        env:
          SUPABASE_URL: https://mock.supabase.co
          SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.dozjgNryP4J3jVmNHl0w5N_XgL0n3I9PlFUP0THsR8U
          SUPABASE_JWT_SECRET: test_ci_jwt_secret_12345678901234567890
          USDA_API_KEY: mock-usda-key
          ENVIRONMENT: test
        run: |
          pytest -v -o "filterwarnings=ignore::DeprecationWarning"

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build TypeScript & Vite bundle
        run: npm run build
