name: CI

on:
  push:
    branches: [ main, feature-remediation-hardening-4914751557843883736 ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0 libzbar-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Compilation
        run: |
          python -m py_compile main.py streamlit_app.py auth.py config.py logger.py model_utils.py schemas.py

      - name: Run Pytest
        env:
          SUPABASE_URL: https://mock.supabase.co
          SUPABASE_KEY: mock-anon-key
          SUPABASE_JWT_SECRET: test_ci_jwt_secret_12345678901234567890
          USDA_API_KEY: mock-usda-key
          ENVIRONMENT: test
        run: |
          pytest -v
